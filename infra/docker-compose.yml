services:
  redis:
    image: redis:7-alpine
    container_name: aglancer_redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  orchestrator:
    build:
      context: ..
      dockerfile: apps/orchestrator/Dockerfile
    container_name: aglancer_orchestrator
    restart: unless-stopped
    env_file:
      - ../.env
    ports:
      - "8000:8000"
    depends_on:
      - redis

  worker:
    build:
      context: ..
      dockerfile: apps/worker/Dockerfile
    container_name: aglancer_worker
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      - redis